<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="arcBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#020c1b"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="plasmaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="arcGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes spinFast { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes coreGlowPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
      .ring-1 { transform-origin: 256px 256px; animation: spinFast 12s linear infinite; }
      .ring-2 { transform-origin: 256px 256px; animation: spinRev 8s linear infinite; }
      .core-singularity { transform-origin: 256px 256px; animation: coreGlowPulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#arcBg)" stroke="#1e3a8a" stroke-width="4"/>
  <!-- Ambient Plasma Aura -->
  <circle cx="256" cy="256" r="160" fill="#00f6ff" opacity="0.08" filter="url(#arcGlow)"/>
  
  <!-- Outer Tech Chassis & Accelerator Coils (10 Coils) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#1e293b" stroke-width="24"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#00f6ff" stroke-width="6" stroke-dasharray="16 38" opacity="0.9"/>

  <!-- Rotating Gyroscopic Outer Ring -->
  <g class="ring-1" filter="url(#arcGlow)">
    <circle cx="256" cy="256" r="135" fill="none" stroke="url(#neonCyan)" stroke-width="5" stroke-dasharray="80 30 20 30 120 40"/>
    <circle cx="256" cy="121" r="8" fill="#ffffff"/>
    <circle cx="256" cy="391" r="8" fill="#00f6ff"/>
    <circle cx="121" cy="256" r="8" fill="#a855f7"/>
    <circle cx="391" cy="256" r="8" fill="#00f6ff"/>
  </g>

  <!-- Counter-Rotating Inner Ring with Chevron Blades -->
  <g class="ring-2" filter="url(#arcGlow)">
    <circle cx="256" cy="256" r="95" fill="none" stroke="url(#plasmaPurple)" stroke-width="6" stroke-dasharray="50 20 60 20"/>
    <polygon points="256,161 264,175 248,175" fill="#00f6ff"/>
    <polygon points="256,351 264,337 248,337" fill="#00f6ff"/>
    <polygon points="161,256 175,264 175,248" fill="#ff007a"/>
    <polygon points="351,256 337,264 337,248" fill="#ff007a"/>
  </g>

  <!-- Central Quantum Singularity / Arc Heart -->
  <g class="core-singularity" filter="url(#arcGlow)">
    <circle cx="256" cy="256" r="55" fill="#050e20" stroke="#00f6ff" stroke-width="4"/>
    <polygon points="256,215 292,236 292,276 256,297 220,276 220,236" fill="url(#neonCyan)" opacity="0.6"/>
    <circle cx="256" cy="256" r="28" fill="#ffffff"/>
    <circle cx="256" cy="256" r="14" fill="#00f6ff"/>
  </g>
</svg>
